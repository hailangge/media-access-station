[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "media-access-station"
version = "0.1.0"
description = "Minimal Media Access Station MVP with local client and Pi-side server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.9,<3",
  "pyyaml>=6,<7",
  "typer>=0.16,<1",
  "uvicorn>=0.32,<1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9"
]

[project.scripts]
mas-client = "media_access_station.client.cli:app"
mas-server = "media_access_station.server.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
