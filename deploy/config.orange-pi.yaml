# Orange Pi production configuration template for Media Access Station.
# Copy to /etc/media-access-station/config.yaml and replace placeholder values.
server:
  host: 0.0.0.0
  port: 8765
security:
  auth_token: replace-with-strong-token
  client_ip_allowlist:
    - 127.0.0.1
    - replace-with-admin-client-ip
  write_enabled: false
  lrc_only_mode: false
nas:
  address: 192.168.0.160
  import_root: /var/lib/media-access-station/nas-import
transport:
  public_key_name: media-access-station-160
  method: local_copy
  rsync:
    command: rsync
    ssh_user: pi
    ssh_port: 22
    extra_args:
      - -a
      - --info=progress2
devices:
  scan_roots:
    - /var/lib/media-access-station/devices
  mount_root: /var/lib/media-access-station/devices
operations:
  service_log_dir: /var/lib/media-access-station/service-logs
  temp_dir: /var/lib/media-access-station/tmp
